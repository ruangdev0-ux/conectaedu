<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A live digital clock for cities around the world." />
    <title>WorldTime — Digital Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="WorldTime home"><span class="brand-mark">◷</span> WorldTime</a>
        <p class="live-indicator"><span aria-hidden="true"></span> Live clock</p>
      </header>

      <main>
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">TIME, ANYWHERE</p>
          <h1 id="page-title">Your world,<br /><em>in sync.</em></h1>
          <p class="intro-copy">Keep track of the moments that matter, wherever they happen.</p>
        </section>

        <section class="clock-section" aria-labelledby="clocks-title">
          <div class="section-heading">
            <h2 id="clocks-title">World clocks</h2>
            <button id="add-clock" class="add-button" type="button">+ Add timezone</button>
          </div>
          <p id="clock-status" class="status" role="status" aria-live="polite"></p>
          <div id="clock-list" class="clock-list"></div>
        </section>
      </main>

      <footer>All times update automatically using your device clock.</footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
